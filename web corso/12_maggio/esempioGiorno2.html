<!DOCTYPE html>

<html>
    <head>
        <meta charset="UTF-8">
        <meta name="description" content="esempio di pagina HTML">
        <meta name="author" content="Nome Autore">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
       
        <title> corso</title>
       
    </head>
    <body>
        <!-- select permette di scegliere un'opzione tra diverse -->
        <select id="corso" name="corso">
            <option value="html">HTML</option>
            <option value="css">CSS</option>
            <option value="js">JavaScript</option>
        </select>

        <!-- checkbox permette di selezionare più opzioni -->
        <p> seleziona le tecnologie conosciute  </p>

        <input type="checkbox" id="html" name="tecnologie" value="html">
        <label for="html">HTML</label>

        <input type="checkbox" id="css" name="tecnologie" value="css">
        <label for="css">CSS</label>

        <input type="checkbox" id="js" name="tecnologie" value="js">
        <label for="js">JavaScript</label>

        <header>
            <h1> Benvenuto </h1>
        </header>
        <nav>
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">Contatti</a></li>
            </ul>
        </nav>
        <!-- main è un elemento che rappresenta il contenuto principale della pagina -->
        <main>
            <!-- section è un elemento che rappresenta una sezione del documento -->
             <!-- article è un elemento che rappresenta un contenuto indipendente all'interno del documento --> 
            <section>
                <h2> Sezione principale </h2>
                <p> Questo è il contenuto della sezione 1. </p>
            </section>
            <article>
                <h2> Articolo </h2>
                <p> Testo di un contenuto indipendente. </p>   
            </article>
            
        </main>
        <!-- footer permette di definire il footer della pagina -->
        <footer>
            <p> Copyright 2026 </p>
        </footer>



        <table border="1">
            <thead>
                <tr>
                    <th>Nome</th>
                    <th>eta</th>
                    <th>Ruolo</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Mario Rossi</td>
                    <td>25</td>
                    <td>Studente</td>
                </tr>
                <tr>
                    <td>Laura</td>
                    <td>30</td>
                    <td>Docente</td>
                </tr>
            </tbody>
        </table>
            

    </body>
</html>
