<!DOCTYPE html>
<html>
<head>
    <title>Hello World</title>
</head>
<body> <!-- Sezione intestazione -->
    <h1>Hello World</h1>    
    <p>Questo è il mio primo programma in <em>HTML</em>!</p>
    <a href="https://www.example.com">Vai al sito web</a> 
    <!-- Un attributo è un valore assegnato a un elemento e permette a un tag di avere proprietà aggiuntive -->
     <video controls width="320" height="240">
        <source src="Registrazione.mp4" type="video/mp4">
        Il tuo browser non supporta il tag video.
    </video>

    <h2>Benvenuto nel mondo della programmazione!</h2>
    <p>Questo è il mio primo <strong>sito web</strong>!</p>
    <p> il <span style="color: rgb(255, 68, 0);">mio primo sito web</span></p>
    <img src="trasferimento.jpg" alt="Descrizione dell'immagine">

    <audio controls> <!-- Il tag audio consente di incorporare file audio in una pagina web -->
        <source src="audio.mp3" type="audio/mpeg">
        Il tuo browser non supporta il tag audio.
    </audio>

    <ul><!-- Elenco non ordinato -->
        <li>Elemento 1</li>
        <li>Elemento 2</li>
        <li>Elemento 3</li>
    </ul>

    <div id="cont" class="box principal" title="contenitore principale"> 
        <!-- Il tag div è un contenitore generico che viene utilizzato per raggruppare elementi e applicare stili o script a un gruppo di elementi
         l'id serve per identificare univocamente l'elemento
         class serve per applicare stili a un gruppo di elementi
         title serve per fornire informazioni aggiuntive sull'elemento -->
        <span style="color: rgb(255, 68, 0);"><p>Contenuto raggruppato</p></span>

        <label for="email">Email</label>
        <input type="email" id="email" ><br>
    </div>

    <form>
        
        <input type="text" placeholder="Inserisci nome" name="nome">
        
        <input type="password" placeholder="Inserisci password" required>
        <input type="email" placeholder="Inserisci email" required>
        <input type="number" placeholder="Inserisci telefono">
        <input type="checkbox" placeholder="checkbox">
        <input type="radio" placeholder="radio">

        <button type="submit">Invia</button>


        
        
    </form>
</body>
</html>
